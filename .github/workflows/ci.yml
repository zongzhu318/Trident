name: 持续集成
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  macos:
    name: macOS 构建与测试
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Node.js 环境
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: 安装项目依赖
        run: npm ci
      - name: 运行单元测试
        run: npm test
      - name: 构建应用
        run: npm run build
      - name: 运行 UI 冒烟测试
        run: npm run test:ui
