name: 持续集成
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  macos:
    name: macOS 构建与测试
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Node.js 环境
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: 安装项目依赖
        run: npm ci
      - name: 运行单元测试
        run: npm test
      - name: 运行 UI 冒烟测试
        timeout-minutes: 5
        run: npm run test:ui
  windows:
    name: Windows 安装包与功能验证
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: 配置 Windows 构建缓存目录
        shell: pwsh
        run: |
          $electronCache = Join-Path $env:RUNNER_TEMP 'electron-cache'
          $builderCache = Join-Path $env:RUNNER_TEMP 'electron-builder-cache'
          "electron_config_cache=$electronCache" >> $env:GITHUB_ENV
          "ELECTRON_CACHE=$electronCache" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_CACHE=$builderCache" >> $env:GITHUB_ENV
      - name: 缓存 Electron 与 NSIS 构建工具
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: windows-packaging-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            windows-packaging-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - run: npm test
      - name: 构建前端并运行 UI 冒烟测试
        timeout-minutes: 5
        run: npm run test:ui
      - name: 设置安装测试版本
        run: |
          $version = node -p "require('./package.json').version"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: 使用已验证的前端构建 NSIS 安装包
        run: npm run package:win:built -- "--config.electronDownload.cache=$env:ELECTRON_CACHE"
      - name: 验证安装、启动和卸载
        timeout-minutes: 5
        run: ./scripts/test-windows-installer.ps1
