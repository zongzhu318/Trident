name: 持续集成
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  macos:
    name: macOS 构建与测试
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 配置 Node.js 环境
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: 安装项目依赖
        run: npm ci
      - name: 运行单元测试
        run: npm test
      - name: 构建应用
        run: npm run build
      - name: 运行 UI 冒烟测试
        run: npm run test:ui
