name: 发布 macOS 版本
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 可选：留空时自动取上一个稳定版 +1；重试 Pages 部署时填写已发布的标签（如 v0.0.1）
        required: false
        type: string
concurrency:
  group: trident-stable-release
  cancel-in-progress: false
jobs:
  prepare:
    name: 准备发布版本
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      reuse: ${{ steps.preflight.outputs.reuse }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Node.js 环境
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
      - name: 读取版本号并生成标签
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG}"
          if [ -z "$TAG" ]; then
            # 取已发布的最高稳定版补丁号 +1；无历史发布时回退 package.json 版本
            LAST="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name | ltrimstr("v")] | sort_by(split(".") | map(tonumber)) | last // empty')"
            if [ -z "$LAST" ]; then
              VERSION="$(node -p "require('./package.json').version")"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "$LAST"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            TAG="v${VERSION}"
          else
            VERSION="${TAG#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::warning::用户录入的版本号有问题：「${VERSION}」不是合法的 X.Y.Z 格式，将在校验阶段失败" >&2
            fi
          fi
          echo "本次发布版本号：${VERSION}"
          echo "本次发布标签：${TAG}"
          {
            echo "### 准备发布版本"
            echo "- 版本号：${VERSION}"
            echo "- 标签：${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: 校验发布条件
        id: preflight
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          REPO="zongzhu318/Trident"
          if [ "$GITHUB_REPOSITORY" != "$REPO" ]; then
            echo "发布流水线只允许在 ${REPO} 运行，当前仓库：${GITHUB_REPOSITORY}" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号格式错误：${RELEASE_VERSION}，应为 X.Y.Z" >&2
            exit 1
          fi
          RELEASES="$(gh api "repos/${REPO}/releases?per_page=100")"
          # 已有更高稳定版时拒绝发布，避免更新源回滚
          HIGHEST="$(echo "$RELEASES" | jq -r '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name | ltrimstr("v")] | sort_by(split(".") | map(tonumber)) | last // empty')"
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$RELEASE_VERSION" | sort -V | tail -n 1)" != "$RELEASE_VERSION" ]; then
            echo "已存在更新的稳定版本 v${HIGHEST}，禁止发布更旧的版本" >&2
            exit 1
          fi
          # 同名草稿必须人工清理后才能重试；已发布产物永不覆盖
          if [ "$(echo "$RELEASES" | jq --arg tag "$RELEASE_TAG" '[.[] | select(.draft and .tag_name == $tag)] | length')" != "0" ]; then
            echo "存在标签 ${RELEASE_TAG} 的草稿。请检查其资产后删除草稿再重试" >&2
            exit 1
          fi
          if [ "$(echo "$RELEASES" | jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | length')" != "0" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "- 复用模式：已存在同名 Release，本次跳过构建，仅重试发布" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "- 复用模式：否，执行完整构建" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 历史更新源检查：临时故障的响应不得被误当作可覆盖的空白更新源
          STATUS="$(curl -sSL --retry 3 -o previous-feed.xml -w '%{http_code}' "https://zongzhu318.github.io/Trident/stable/appcast-arm64.xml" || true)"
          if [ "$STATUS" = "200" ]; then
            VERSIONS="$(python3 -c "import xml.etree.ElementTree as E; print('\n'.join(e.text for e in E.parse('previous-feed.xml').findall('.//{http://www.andymatuschak.org/xml-namespaces/sparkle}version')))" | sed '/^$/d')"
            if [ -z "$VERSIONS" ]; then
              echo "历史更新源中没有任何版本记录，拒绝覆盖" >&2
              exit 1
            fi
            while IFS= read -r v; do
              if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "历史更新源包含非法版本号：${v}" >&2
                exit 1
              fi
              if [ "$(printf '%s\n%s\n' "$v" "$RELEASE_VERSION" | sort -V | tail -n 1)" != "$RELEASE_VERSION" ]; then
                echo "历史更新源包含高于本次版本的记录 v${v}，拒绝回滚更新源" >&2
                exit 1
              fi
            done <<< "$VERSIONS"
          elif [ "$STATUS" != "404" ]; then
            echo "无法读取历史更新源：HTTP ${STATUS}" >&2
            exit 1
          fi
          # Sparkle 公钥必须由私钥推导得出
          node <<'EOF'
          const crypto = require("node:crypto");
          const seed = Buffer.from((process.env.SPARKLE_PRIVATE_KEY || "").trim(), "base64");
          if (seed.length !== 32) {
            console.error("SPARKLE_PRIVATE_KEY 必须是 32 字节的新版 Sparkle seed（base64）");
            process.exit(1);
          }
          const privateKey = crypto.createPrivateKey({
            key: Buffer.concat([Buffer.from("302e020100300506032b657004220420", "hex"), seed]),
            format: "der",
            type: "pkcs8",
          });
          const publicKey = crypto
            .createPublicKey(privateKey)
            .export({ format: "der", type: "spki" })
            .subarray(-32)
            .toString("base64");
          if (publicKey !== (process.env.SPARKLE_PUBLIC_KEY || "").trim()) {
            console.error("Sparkle 公钥与私钥不匹配");
            process.exit(1);
          }
          EOF
      - name: 确定待发布提交
        id: commit
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if [ "${{ steps.preflight.outputs.reuse }}" != "true" ] && git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "::error::标签 ${TAG} 已存在。请删除该标签后重试，或改用该标签触发重试流程" >&2
            exit 1
          fi
          if [ "${{ steps.preflight.outputs.reuse }}" = "true" ]; then
            SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          else
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
  test:
    name: 单元测试
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 检出待发布代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: 配置 Node.js 环境
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: 安装项目依赖
        run: npm ci
      - name: 运行单元测试
        run: npm test
  build:
    name: 编译打包
    needs: [prepare, test]
    if: needs.prepare.outputs.reuse != 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - name: 检出待发布代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: 配置 Node.js 环境
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: 获取 Sparkle SDK
        run: |
          set -euo pipefail
          SDK_VERSION="2.10.0"
          SDK_SHA256="c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"
          MARKER="vendor/sparkle/.verified-version"
          if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "${SDK_VERSION}:${SDK_SHA256}" ]; then
            echo "Sparkle SDK 已就位"
            exit 0
          fi
          mkdir -p vendor
          curl --fail --location --retry 3 \
            -o "vendor/Sparkle-${SDK_VERSION}.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SDK_VERSION}/Sparkle-${SDK_VERSION}.tar.xz"
          echo "${SDK_SHA256}  vendor/Sparkle-${SDK_VERSION}.tar.xz" | shasum -a 256 -c -
          rm -rf vendor/sparkle
          mkdir -p vendor/sparkle
          tar -xJf "vendor/Sparkle-${SDK_VERSION}.tar.xz" -C vendor/sparkle
          echo "${SDK_VERSION}:${SDK_SHA256}" > "$MARKER"
      - name: 安装项目依赖
        run: npm ci
      - name: 运行 UI 冒烟测试
        run: npm run test:ui
      - name: 编译 Sparkle 原生桥接
        run: |
          set -euo pipefail
          NODE_VERSION="$(node -p "process.versions.node")"
          INCLUDE="vendor/node-v${NODE_VERSION}/include/node"
          if [ ! -f "${INCLUDE}/node_api.h" ]; then
            curl --fail --location --retry 3 \
              -o "vendor/node-v${NODE_VERSION}-headers.tar.gz" \
              "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-headers.tar.gz"
            tar -xzf "vendor/node-v${NODE_VERSION}-headers.tar.gz" -C vendor
          fi
          xcrun clang++ \
            -std=c++17 -fobjc-arc -fblocks -DNAPI_VERSION=8 \
            -DNODE_GYP_MODULE_NAME=sparkle_bridge \
            -mmacosx-version-min=12.0 -arch arm64 \
            -bundle -undefined dynamic_lookup \
            -I "$INCLUDE" \
            -F vendor/sparkle \
            -framework Cocoa -framework Sparkle \
            -Wl,-rpath,@loader_path/../../Frameworks \
            native/sparkle-bridge/bridge.mm \
            -o native/sparkle-bridge/sparkle-bridge.node
      - name: 生成打包配置
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const key = (process.env.SPARKLE_PUBLIC_KEY || "").trim();
          if (
            !/^[A-Za-z0-9+/]{43}=$/.test(key) ||
            Buffer.from(key, "base64").length !== 32
          )
            throw new Error(
              "SPARKLE_PUBLIC_KEY 必须是 Sparkle generate_keys 生成的 32 字节公钥（base64）",
            );
          const version = process.env.RELEASE_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version))
            throw new Error("稳定版发布要求 x.y.z 版本号");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const config = {
            ...pkg.build,
            afterPack: "./build/after-pack.cjs",
            artifactName: "Trident-${version}-${arch}.${ext}",
            buildVersion: version,
            extraMetadata: { version },
            mac: {
              ...pkg.build.mac,
              target: [{ target: "dir", arch: ["arm64"] }],
              identity: "-",
              hardenedRuntime: false,
              minimumSystemVersion: "12.0",
              extendInfo: {
                SUFeedURL:
                  "https://zongzhu318.github.io/Trident/stable/appcast-arm64.xml",
                SUPublicEDKey: key,
                SUEnableAutomaticChecks: false,
                SUAllowsAutomaticUpdates: false,
                SUAutomaticallyUpdate: false,
                SUVerifyUpdateBeforeExtraction: true,
                SURequireSignedFeed: true,
              },
            },
            dmg: { sign: false },
          };
          fs.writeFileSync(
            "build/sparkle-config.json",
            JSON.stringify(config, null, 2),
          );
          EOF
      - name: 打包应用
        run: |
          ./node_modules/.bin/electron-builder \
            --config build/sparkle-config.json \
            --mac --arm64 --publish never
      - name: 生成 DMG（ad-hoc 签名）
        run: |
          set -euo pipefail
          STAGING="$(mktemp -d)"
          trap 'rm -rf "$STAGING"' EXIT
          ditto "release/mac-arm64/Trident.app" "${STAGING}/Trident.app"
          ln -s /Applications "${STAGING}/Applications"
          hdiutil create \
            -volname "Trident ${RELEASE_VERSION}" \
            -srcfolder "$STAGING" \
            -format ULMO \
            -ov \
            "release/Trident-${RELEASE_VERSION}-arm64.dmg"
      - name: 验证打包后的原生更新器
        env:
          APP_PATH: release/mac-arm64/Trident.app
        run: |
          node <<'EOF'
          const { spawn, execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const assert = require("node:assert/strict");
          const appPath = path.resolve(process.env.APP_PATH);
          const temp = fs.mkdtempSync(path.join(os.tmpdir(), "trident-sparkle-"));
          const fixture = path.join(temp, "cocoa-terminate.node");
          const marker = path.join(temp, "before-quit");
          execFileSync("xcrun", [
            "clang++",
            "-fobjc-arc",
            "-fblocks",
            "-DNAPI_VERSION=8",
            "-DNODE_GYP_MODULE_NAME=cocoa_terminate",
            "-bundle",
            "-undefined",
            "dynamic_lookup",
            "-I",
            process.env.NODE_API_HEADERS ||
              path.resolve(`vendor/node-v${process.versions.node}/include/node`),
            "-framework",
            "Cocoa",
            "tests/helpers/cocoa-terminate.mm",
            "-o",
            fixture,
          ]);
          const environment = { ...process.env };
          delete environment.ELECTRON_RUN_AS_NODE;
          const child = spawn(
            path.join(appPath, "Contents/MacOS/Trident"),
            ["--inspect=127.0.0.1:0", `--user-data-dir=${temp}`],
            { env: environment, stdio: ["ignore", "pipe", "pipe"] },
          );
          let socket;
          const timer = setTimeout(() => {
            console.error("Native updater smoke timed out");
            child.kill();
            process.exitCode = 1;
          }, 30000);
          let started = false;
          let stderr = "";
          child.stdout.on("data", (chunk) => {
            stderr += chunk;
          });
          child.on("error", (error) => {
            console.error(error);
            clearTimeout(timer);
            process.exitCode = 1;
          });
          child.stderr.on("data", async (chunk) => {
            stderr += chunk;
            const match = stderr.match(/Debugger listening on (ws:\/\/[^\s]+)/);
            if (!match || started) return;
            started = true;
            try {
              socket = new WebSocket(match[1]);
              await new Promise((resolve, reject) => {
                socket.onopen = resolve;
                socket.onerror = reject;
              });
              let sequence = 0;
              const pending = new Map();
              socket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.id) {
                  const p = pending.get(message.id);
                  pending.delete(message.id);
                  if (message.error) p.reject(message.error);
                  else p.resolve(message.result);
                }
              };
              const evaluate = (expression) =>
                new Promise((resolve, reject) => {
                  const id = ++sequence;
                  pending.set(id, { resolve, reject });
                  socket.send(
                    JSON.stringify({
                      id,
                      method: "Runtime.evaluate",
                      params: { expression, awaitPromise: true, returnByValue: true },
                    }),
                  );
                });
              const result = await evaluate(`(async () => {
                for (let i = 0; i < 100 && !process.mainModule; i++) await new Promise(r => setTimeout(r, 50));
                const { app, Menu } = process.mainModule.require('electron');
                await app.whenReady();
                for (let i = 0; i < 100 && !Menu.getApplicationMenu()?.items[0]?.submenu?.items.some(item => item.label === '自动检查更新'); i++) await new Promise(r => setTimeout(r, 50));
                const menu = Menu.getApplicationMenu().items[0].submenu.items;
                const automatic = menu.find(item => item.label === '自动检查更新');
                if (!automatic?.enabled) throw new Error('Native updater not enabled');
                const bridge = process.mainModule.require(process.resourcesPath + '/sparkle/sparkle-bridge.node');
                bridge.setBusy(true);
                let blocked = false;
                try { bridge.check(); } catch { blocked = true; }
                bridge.setBusy(false);
                const original = bridge.state().automatic;
                bridge.setAutomatic(!original);
                const toggled = bridge.state().automatic === !original;
                bridge.setAutomatic(original);
                return { packaged: app.isPackaged, version: app.getVersion(), blocked, toggled, original, state: bridge.state(), checkMenu: !!menu.find(item => item.label === '检查更新…') };
              })()`);
              if (result.exceptionDetails)
                throw new Error(JSON.stringify(result.exceptionDetails));
              const state = result.result.value;
              assert.equal(state.packaged, true);
              assert.equal(state.blocked, true);
              assert.equal(state.toggled, true);
              assert.equal(state.checkMenu, true);
              assert.equal(state.state.canCheck, true);
              assert.equal(state.state.automatic, state.original);
              console.log("Native Sparkle smoke passed:", JSON.stringify(state));
              // Sparkle uses Cocoa termination. Verify it reaches Electron before-quit.
              await evaluate(
                `process.mainModule.require('electron').app.on('before-quit', () => process.mainModule.require('node:fs').appendFileSync(${JSON.stringify(marker)}, 'before-quit\\n')); setTimeout(() => process.mainModule.require(${JSON.stringify(fixture)}).terminate(), 100); 'quitting'`,
              );
              socket.close();
            } catch (error) {
              console.error(error, stderr);
              process.exitCode = 1;
              socket?.close();
              child.kill();
            }
          });
          child.on("exit", (code, signal) => {
            clearTimeout(timer);
            socket?.close();
            if (code !== 0 || signal || !started || !fs.existsSync(marker)) {
              console.error(
                "Application exited unexpectedly or bypassed before-quit",
                code,
                signal,
                stderr,
              );
              process.exitCode = 1;
            } else console.log("Cocoa termination passed through Electron before-quit");
          });
          EOF
      - name: 归档应用目录
        # upload-artifact 不保留符号链接，直接上传 .app 会破坏
        # Electron Framework.framework 内部的 Versions/Current 等软链，
        # 导致下游 codesign 校验报 "bundle format is ambiguous"
        run: tar -czf release/Trident-app.tar.gz -C release/mac-arm64 Trident.app
      - name: 上传编译产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/Trident-app.tar.gz
          retention-days: 7
  publish:
    name: 发布（Tag 与 Releases）
    needs: [prepare, build]
    # build 在 reuse=true 的重试场景下会被跳过，此时 publish 仍需运行
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DMG_NAME: Trident-${{ needs.prepare.outputs.version }}-arm64.dmg
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: 检出待发布代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: 配置 Node.js 环境
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
      - name: 获取 Sparkle SDK
        run: |
          set -euo pipefail
          SDK_VERSION="2.10.0"
          SDK_SHA256="c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"
          MARKER="vendor/sparkle/.verified-version"
          if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "${SDK_VERSION}:${SDK_SHA256}" ]; then
            echo "Sparkle SDK 已就位"
            exit 0
          fi
          mkdir -p vendor
          curl --fail --location --retry 3 \
            -o "vendor/Sparkle-${SDK_VERSION}.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SDK_VERSION}/Sparkle-${SDK_VERSION}.tar.xz"
          echo "${SDK_SHA256}  vendor/Sparkle-${SDK_VERSION}.tar.xz" | shasum -a 256 -c -
          rm -rf vendor/sparkle
          mkdir -p vendor/sparkle
          tar -xJf "vendor/Sparkle-${SDK_VERSION}.tar.xz" -C vendor/sparkle
          echo "${SDK_VERSION}:${SDK_SHA256}" > "$MARKER"
      - name: 下载编译产物
        if: needs.prepare.outputs.reuse != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release
          path: release
      - name: 解包应用目录
        if: needs.prepare.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          mkdir -p release/mac-arm64
          tar -xzf release/Trident-app.tar.gz -C release/mac-arm64
          rm release/Trident-app.tar.gz
      - name: 创建并推送版本标签
        if: needs.prepare.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            git push origin "refs/tags/${TAG}:refs/tags/${TAG}"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
      - name: 校验标签与签名密钥
        run: |
          set -euo pipefail
          # 标签必须指向当前检出的提交
          COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "检出的提交与标签 ${RELEASE_TAG} 不一致" >&2
            exit 1
          fi
          # Sparkle 公钥必须由私钥推导得出
          node <<'EOF'
          const crypto = require("node:crypto");
          const seed = Buffer.from((process.env.SPARKLE_PRIVATE_KEY || "").trim(), "base64");
          if (seed.length !== 32) {
            console.error("SPARKLE_PRIVATE_KEY 必须是 32 字节的新版 Sparkle seed（base64）");
            process.exit(1);
          }
          const privateKey = crypto.createPrivateKey({
            key: Buffer.concat([Buffer.from("302e020100300506032b657004220420", "hex"), seed]),
            format: "der",
            type: "pkcs8",
          });
          const publicKey = crypto
            .createPublicKey(privateKey)
            .export({ format: "der", type: "spki" })
            .subarray(-32)
            .toString("base64");
          if (publicKey !== (process.env.SPARKLE_PUBLIC_KEY || "").trim()) {
            console.error("Sparkle 公钥与私钥不匹配");
            process.exit(1);
          }
          EOF
      - name: 校验打包应用元数据
        if: needs.prepare.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          APP="release/mac-arm64/Trident.app"
          # 不能加 --deep：Electron Framework.framework 同时具备 app/framework 两种
          # bundle 特征，--deep 遍历时会报 "bundle format is ambiguous"
          codesign --verify --strict "$APP"
          plutil -convert json -o - "${APP}/Contents/Info.plist" | jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg public_key "$(printf '%s' "$SPARKLE_PUBLIC_KEY" | tr -d '[:space:]')" \
            --arg feed_url "https://zongzhu318.github.io/Trident/stable/appcast-arm64.xml" \
            '.CFBundleVersion == $version
              and .CFBundleShortVersionString == $version
              and .SUPublicEDKey == $public_key
              and .SUFeedURL == $feed_url
              and .SURequireSignedFeed == true
              and .SUVerifyUpdateBeforeExtraction == true' > /dev/null \
            || { echo "打包后的更新器元数据与发布配置不一致" >&2; exit 1; }
      - name: 生成并校验更新源
        if: needs.prepare.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          ARCHIVES=".release-work/archives"
          FEED="${ARCHIVES}/appcast-arm64.xml"
          mkdir -p "$ARCHIVES"
          cp "release/${DMG_NAME}" "${ARCHIVES}/${DMG_NAME}"
          cp docs/release-notes.md "${ARCHIVES}/${DMG_NAME%.dmg}.md"
          # Pages 上已有历史更新源时，先确认它能被当前私钥验证
          STATUS="$(curl -sSL --retry 3 -o "$FEED" -w '%{http_code}' "https://zongzhu318.github.io/Trident/stable/appcast-arm64.xml" || true)"
          if [ "$STATUS" = "200" ]; then
            printf '%s\n' "$SPARKLE_PRIVATE_KEY" | vendor/sparkle/bin/sign_update --ed-key-file - --verify "$FEED"
          elif [ "$STATUS" = "404" ]; then
            rm -f "$FEED"
          else
            echo "无法读取历史更新源：HTTP ${STATUS}" >&2
            exit 1
          fi
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | vendor/sparkle/bin/generate_appcast \
            --ed-key-file - \
            --maximum-deltas 0 \
            --embed-release-notes \
            --maximum-versions 3 \
            --download-url-prefix "https://github.com/zongzhu318/Trident/releases/download/${RELEASE_TAG}/" \
            -o "$FEED" "$ARCHIVES"
          # 生成后立即校验：必须恰好包含本次版本、下载地址正确、签名有效、不支持增量
          python3 - "$FEED" "$RELEASE_VERSION" "$DMG_NAME" "${ARCHIVES}/metadata.json" <<'PYEOF'
          import sys, json, xml.etree.ElementTree as ET
          feed, version, filename, out = sys.argv[1:]
          ns = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          root = ET.parse(feed).getroot()
          assert root.tag == "rss", "Expected RSS appcast"
          items = root.findall("./channel/item")
          matching = [item for item in items if item.findtext(ns + "version") == version]
          assert len(matching) == 1, "Expected exactly one matching build version"
          item = matching[0]
          assert item.findtext(ns + "shortVersionString") == version
          assert item.findtext(ns + "minimumSystemVersion"), "Missing macOS requirement"
          enclosure = item.find("enclosure")
          assert enclosure is not None
          assert enclosure.get("url") == f"https://github.com/zongzhu318/Trident/releases/download/v{version}/{filename}"
          assert int(enclosure.get("length", "0")) > 0
          assert enclosure.get(ns + "edSignature"), "Missing update signature"
          assert not root.findall(".//" + ns + "deltas"), "Delta updates not supported in this release pipeline"
          with open(out, "w") as fh:
              json.dump({"signature": enclosure.get(ns + "edSignature"), "length": int(enclosure.get("length"))}, fh)
          PYEOF
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | vendor/sparkle/bin/sign_update --ed-key-file - --verify "$FEED"
          # DMG 实际大小与 appcast 记录必须一致，且签名可验证
          LENGTH="$(jq -r '.length' "${ARCHIVES}/metadata.json")"
          ACTUAL_LENGTH="$(stat -f%z "${ARCHIVES}/${DMG_NAME}")"
          if [ "$ACTUAL_LENGTH" != "$LENGTH" ]; then
            echo "DMG 大小与更新源记录不一致：${ACTUAL_LENGTH} != ${LENGTH}" >&2
            exit 1
          fi
          SIGNATURE="$(jq -r '.signature' "${ARCHIVES}/metadata.json")"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | vendor/sparkle/bin/sign_update --ed-key-file - --verify "${ARCHIVES}/${DMG_NAME}" "$SIGNATURE"
          {
            shasum -a 256 "${ARCHIVES}/${DMG_NAME}" "${ARCHIVES}/appcast-arm64.xml" | sed "s#${ARCHIVES}/##"
          } > "${ARCHIVES}/SHA256SUMS"
      - name: 发布正式 Release
        if: needs.prepare.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          # 先建草稿传产物，确认无误后转正；发布产物不可变，绝不覆盖
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Trident ${RELEASE_VERSION}" --notes-file docs/release-notes.md
          gh release upload "$RELEASE_TAG" \
            ".release-work/archives/${DMG_NAME}" \
            ".release-work/archives/appcast-arm64.xml" \
            ".release-work/archives/SHA256SUMS"
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: 复用已发布的更新源（重试场景）
        if: needs.prepare.outputs.reuse == 'true'
        run: |
          set -euo pipefail
          mkdir -p .release-work/archives
          gh release download "$RELEASE_TAG" --pattern appcast-arm64.xml --dir .release-work/archives --clobber
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | vendor/sparkle/bin/sign_update --ed-key-file - --verify ".release-work/archives/appcast-arm64.xml"
      - name: 校验产物可达并准备 Pages 部署产物
        run: |
          set -euo pipefail
          # 更新源只有在正式产物可下载后才允许部署
          curl --fail --location --head --retry 5 --retry-all-errors \
            "https://github.com/zongzhu318/Trident/releases/download/${RELEASE_TAG}/${DMG_NAME}" > /dev/null
          PAGES=".release-work/pages"
          mkdir -p "${PAGES}/stable"
          cp .release-work/archives/appcast-arm64.xml "${PAGES}/stable/appcast-arm64.xml"
          touch "${PAGES}/.nojekyll"
          cat > "${PAGES}/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Trident 更新</title><a href="https://github.com/zongzhu318/Trident/releases/latest">下载 Trident for macOS</a>
          HTML
      - name: 上传 Pages 部署产物
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .release-work/pages
  pages:
    name: 部署更新源到 GitHub Pages
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署更新源
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: 校验线上更新源与 Release 一致
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 5 --retry-all-errors "https://github.com/zongzhu318/Trident/releases/download/${RELEASE_TAG}/appcast-arm64.xml" -o release.xml
          for attempt in {1..12}; do
            if curl -fLsS "https://zongzhu318.github.io/Trident/stable/appcast-arm64.xml?release=${RELEASE_TAG}&attempt=${attempt}" -o pages.xml && cmp -s release.xml pages.xml; then
              exit 0
            fi
            sleep 5
          done
          echo 'Pages feed is not yet identical to the release asset.' >&2
          exit 1
